[workspace]
resolver = "2"
default-members = ["crates/dimensify", "crates/ui", "crates/transport", "crates/session", "crates/hub"]
members = ["crates/dimensify", "crates/ui", "crates/transport", "crates/session", "crates/hub", "crates/splat", "crates/camera", "crates/interpolation", "crates/sog_codec", "crates/splat_sort", "tools/perf"]
exclude = ["vendor/bevy_editor_cam", "vendor/bevy_gaussian_splatting", "crates/protocol", "crates/component_derive", "crates/widgets", "python", "legacy/transport"]

[workspace.package]
authors = ["soraxas <tin@tinyiu.com>"]
edition = "2024"
homepage = "https://github.com/soraxas/dimensify"
include = [
#   "../../Cargo.lock", # So that users can pass `--locked` to `cargo install ...`
  "**/*.rs",
  "Cargo.toml",
]
license = ""
repository = "https://github.com/soraxas/dimensify"
rust-version = "1.98"
version = "0.1.0"




[profile.release]
opt-level = 's'
# Do a second optimization pass over the entire program, including dependencies.
# Slows compile times, marginal improvements.
lto       = "thin"
# Enable more optimization in the release profile at the cost of compile time.
# Compile the entire crate as one unit.
# Slows compile times, marginal improvements.
codegen-units = 1

# CPU benchmarks measure throughput rather than the size-optimized release build.
[profile.bench]
inherits = "release"
opt-level = 3

# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 3

# Compile native verification without the interactive viewer's dependency optimizations.
[profile.ci]
inherits = "dev"
opt-level = 0
debug = 0
incremental = false

[profile.ci.package."*"]
opt-level = 0

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
# Strip all debugging information from the binary to slightly reduce file size.
strip = "debuginfo"


[workspace.lints.rust]
unsafe_code = "deny"

# absolute_paths_not_starting_with_crate = "warn"
# elided_lifetimes_in_paths = "warn"
# future_incompatible = { level = "warn", priority = -1 }
# non_ascii_idents = "warn"
# nonstandard_style = { level = "warn", priority = -1 }
# noop_method_call = "warn"
# rust_2018_idioms = { level = "warn", priority = -1 }
# rust_2021_prelude_collisions = "warn"
# semicolon_in_expressions_from_macros = "warn"
# trivial_numeric_casts = "warn"
# unsafe_op_in_unsafe_fn = "warn" # `unsafe_op_in_unsafe_fn` may become the default in future Rust versions: https://github.com/rust-lang/rust/issues/71668
# unexpected_cfgs = { level = "deny", check-cfg = [
#   'cfg(TODO)', # NOLINT allow `#[cfg(TODO)]` to compile (it will still fail CI)
# ] }
# unused_extern_crates = "warn"
# unused_import_braces = "warn"
# unused_lifetimes = "warn"

# trivial_casts = "allow"
# unused_qualifications = "allow"

[patch.crates-io]
# Pending connection cancellation and closed-stream fixes; see docs/collaboration.md.
aeronet_webtransport = { git = "https://github.com/soraxas/aeronet", rev = "79fc5b2c0d30dcdac1ba3638ab6c733e9ef4c0a6" }
wtransport = { git = "https://github.com/soraxas/wtransport", rev = "01c4a60544152702c834adeb5e1be8b8e11602bb" }

[workspace.dependencies]
# Only active members inherit from this table; excluded prototypes do not
# resolve against this workspace (see docs/architecture.md).
dimensify_ui = { path = "crates/ui", version = "0.1.0", default-features = false }

# One exact pin for every collaboration crate: session uses lightyear internals.
lightyear = { version = "=0.30.1", default-features = false }

color-eyre = "0.6.3"
eyre       = "0.6.12"
thiserror  = "2"

mesh-loader = { version = "0.1.12" }
urdf-rs     = { version = "0.9.0" }

serde      = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0"

bevy_math = { version = "0.19", default-features = false }

# Versions the uncompiled prototype sources in crates/dimensify/src and
# crates/ui/src were written against (physics, collision, robot control, editor
# UI). No active member uses these; keep them as the starting point for reviving
# that code.
k                    = { version = "0.32.0" }
nalgebra             = "0.33.2"
rapier3d             = { version = "0.27.0-beta.0" } # same as bevy_rapier3d
bevy_rapier3d        = "0.32.0"
bevy_egui            = { version = "0.40", default-features = false, features = ["open_url", "default_fonts", "render", "bevy_ui", "picking"] }
bevy-inspector-egui  = "0.37.0"
bevy_panorbit_camera = { version = "0.34", features = ["bevy_egui"] }
bevy_infinite_grid   = "0.18"
bevy_crossbeam_event = "0.11.0"
egui_tiles           = "0.14.0"
egui_extras          = { version = "0.33.2", features = ["all_loaders"] }

[workspace.dependencies.bevy]
version = "0.19"
default-features = false
features = ["std", "async_executor"]
