<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dimensify Splat Viewer</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #070a0e;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas id="dimensify-canvas" aria-label="Dimensify Splat Viewer"></canvas>
    <script type="module">
      import init from "./pkg/splat_viewer.js";
      init().catch((error) => {
        console.error("Viewer could not start:", error);
        document.body.append(
          "Viewer could not start. Use a WebGPU-capable browser over HTTPS or localhost.",
        );
      });
    </script>
  </body>
</html>
