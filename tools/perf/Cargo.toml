[package]
name = "dimensify_perf"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = []
pipeline = ["dimensify_splat/test-support", "dimensify_splat/sh3", "dimensify_splat/sog-gpu-timing", "dep:bevy", "dep:bevy_gaussian_splatting", "dep:sha2", "dep:zip"]
gpu = ["pipeline", "dep:sysinfo", "dep:objc2-metal"]
lod = ["gpu", "dimensify_splat/streaming", "dimensify_splat/webgpu", "bevy/bevy_winit", "bevy/x11"]
visual = ["dimensify_splat/render", "dimensify_splat/sh3", "dimensify_splat/webgpu", "dep:bevy", "bevy/bevy_winit", "bevy/x11", "dep:bevy_gaussian_splatting", "image/png", "dep:sha2", "dep:wgpu", "dep:wasm-bindgen", "dep:js-sys", "dep:web-sys"]

[dependencies]
bevy = { workspace = true, optional = true, features = ["multi_threaded"] }
bevy_math = { workspace = true, features = ["std"] }
dimensify_splat = { path = "../../crates/splat", default-features = false }
image = { version = "=0.25.9", default-features = false, features = ["webp"] }
serde_json = "1"
sha2 = { version = "0.10", optional = true }
sog_codec = { path = "../../vendor/sog_codec" }
splat_sort = { path = "../../vendor/splat_sort" }
bevy_gaussian_splatting = { optional = true, path = "../../vendor/bevy_gaussian_splatting", default-features = false, features = ["io_sog", "planar", "buffer_storage", "sort_radix", "sort_std", "sh3", "gpu_timing", "render_diagnostics"] }
zip = { optional = true, version = "2", default-features = false, features = ["deflate"] }

wgpu = { version = "29", default-features = false, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sysinfo = { version = "=0.38.4", default-features = false, features = ["system"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-metal = { version = "=0.3.2", default-features = false, features = ["std", "MTLDevice"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = ["Window", "Location"] }

[dev-dependencies]
criterion = { version = "=0.5.1", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "cpu"
harness = false

[[bench]]
name = "pipeline"
harness = false
required-features = ["pipeline"]

[[bin]]
name = "gpu"
required-features = ["gpu"]

[[bin]]
name = "perf-fixtures"
path = "src/bin/fixtures.rs"
required-features = ["pipeline"]

[[bin]]
name = "lod"
required-features = ["lod"]

[[bin]]
name = "visual"
required-features = ["visual"]

[lints]
workspace = true
