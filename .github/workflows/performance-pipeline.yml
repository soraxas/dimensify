name: Pipeline CPU performance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Seed three measured main-branch reports for this CPU testbed
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pipeline-cpu-performance-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  MBX_CACHE_LINKS: "0"

jobs:
  measure:
    name: Measure pipeline CPU workloads
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate manual run ref
        if: github.event_name == 'workflow_dispatch'
        run: test "$GITHUB_REF" = refs/heads/main
      - name: Install renderer build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libx11-dev libxkbcommon-dev
      - uses: ./.github/actions/setup-rust
        with:
          lane: cpu-perf-pipeline-v1
      - name: Validate workloads and reporting logic
        run: mise exec -- just ci-perf-pipeline
      - name: Measure without reporting credentials
        env:
          BOOTSTRAP: ${{ inputs.bootstrap || false }}
        run: |
          args=()
          if [[ "$BOOTSTRAP" == true ]]; then args+=(--bootstrap); fi
          mise exec -- python3 scripts/perf.py run --suite pipeline "${args[@]}"
      - name: Measure the exact PR base on the same runner
        if: github.event_name == 'pull_request'
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
        run: |
          base_checkout="$RUNNER_TEMP/perf-base"
          git fetch --no-tags --depth=1 origin "$BASE_COMMIT"
          git worktree add --detach "$base_checkout" "$BASE_COMMIT"
          trap 'git worktree remove --force "$base_checkout"' EXIT
          mise exec -- python3 scripts/perf.py run --suite pipeline --bootstrap --checkout "$base_checkout" --output "$GITHUB_WORKSPACE/dist/performance/base"
      - name: Explain artifact-only performance coverage
        if: github.event_name == 'pull_request'
        run: echo 'Performance measurements are saved as artifacts. Fork and Dependabot PRs receive artifact-only coverage because Actions secrets are withheld; a skipped Bencher gate does not claim a regression pass.' >> "$GITHUB_STEP_SUMMARY"
      - name: Save measurements and environment
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cpu-measurements
          path: dist/performance/
          retention-days: 30
          if-no-files-found: error

  gate:
    name: Pipeline CPU performance gate
    needs: measure
    # Fork and Dependabot PRs get artifacts only; Actions withholds secrets.
    # Never use pull_request_target to bypass that boundary.
    if: always() && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor_id != '49699333'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Require successful measurements
        env:
          MEASUREMENT_RESULT: ${{ needs.measure.result }}
        run: test "$MEASUREMENT_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.8
          install_args: python github:bencherdev/bencher
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cpu-measurements
          path: dist/performance/
      - name: Publish saved measurements and enforce the threshold
        env:
          BENCHER_PROJECT: ${{ vars.BENCHER_PROJECT }}
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          BOOTSTRAP: ${{ inputs.bootstrap || false }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=()
          if [[ "$BOOTSTRAP" == true ]]; then args+=(--bootstrap); fi
          if [[ "$EVENT_NAME" == pull_request ]]; then args+=(--paired-base dist/performance/base); fi
          mise exec -- python3 scripts/perf.py upload --suite pipeline "${args[@]}"
      - name: Save Bencher reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cpu-bencher-reports
          path: dist/performance/
          retention-days: 30
          if-no-files-found: error
