name: Visual diff report

on: # zizmor: ignore[dangerous-triggers] default-branch code only; bounded PNG artifacts are validated, never executed
  workflow_run:
    workflows: [Visual correctness]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run:
        description: Completed Visual correctness run ID to publish
        required: true
        type: string
      upload_only:
        description: Upload candidate references without comparing or approving them
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  availability:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      artifacts: ${{ steps.artifacts.outputs.artifacts }}
      has_captures: ${{ steps.artifacts.outputs.has_captures }}
      source_conclusion: ${{ steps.artifacts.outputs.source_conclusion }}
    steps:
      - name: State optional reporting configuration
        env:
          ENABLED: ${{ vars.PIXEL_EAGLE_ENABLED }}
        run: |
          if [[ "$ENABLED" == true ]]; then
            echo 'Pixel Eagle reporting is enabled. Local render assertions run independently.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Automatic Pixel Eagle upload/comparison is SKIPPED (not enabled). An explicit upload-only dispatch may bootstrap references; it never claims a passed comparison. Local render assertions remain active.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.8
          install_args: python
          cache: false
      - name: Plan reporting from actual source captures
        id: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id || inputs.source_run }}
        run: mise exec -- python3 scripts/visual-artifact.py --plan --run "$SOURCE_RUN"

  source-status:
    needs: availability
    if: needs.availability.outputs.source_conclusion != 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Preserve the failed source verdict separately from image comparison
        env:
          SOURCE_CONCLUSION: ${{ needs.availability.outputs.source_conclusion }}
        run: |
          echo "Source Visual correctness concluded $SOURCE_CONCLUSION. See its logs or approval status; missing captures cannot be compared." >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Source Visual correctness did not succeed; this is a source failure, not an image comparison failure."
          exit 1

  report:
    needs: availability
    # Trusted default-branch code only. Never checkout or execute source PR code.
    if: needs.availability.outputs.has_captures == 'true' && ((github.event_name == 'workflow_dispatch' && inputs.upload_only) || (vars.PIXEL_EAGLE_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.conclusion != 'skipped'))))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        artifact: ${{ fromJSON(needs.availability.outputs.artifacts) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.8
          install_args: python
          cache: false
      - name: Resolve authoritative source identity and pinned reference
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id || inputs.source_run }}
          BASELINES: ${{ vars.PIXEL_EAGLE_BASELINES }}
          ARTIFACT: ${{ matrix.artifact }}
          UPLOAD_ONLY: ${{ inputs.upload_only || false }}
        run: |
          mise exec -- python3 - <<'PY'
          import json, os, re, subprocess
          source = os.environ['SOURCE_RUN']
          if not re.fullmatch(r'[1-9][0-9]{0,15}', source):
              raise ValueError('Invalid source run ID')
          endpoint = f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{source}"
          run = json.loads(subprocess.check_output(['gh', 'api', endpoint]))
          commit = run['head_sha']
          if not re.fullmatch(r'[0-9a-f]{40}', commit):
              raise ValueError('Invalid source commit')
          baseline = ''
          if os.environ['UPLOAD_ONLY'] != 'true':
              baseline = json.loads(os.environ['BASELINES'])[os.environ['ARTIFACT']]
              if type(baseline) is not int or baseline <= 0:
                  raise ValueError('Configure a reviewed fixed baseline run ID for this lane')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'run={source}\ncommit={commit}\nbaseline={baseline}\n')
          PY
      - name: Download and validate source images as untrusted data
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ steps.source.outputs.run }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          ARTIFACT: ${{ matrix.artifact }}
        run: mise exec -- python3 scripts/visual-artifact.py --run "$SOURCE_RUN" --commit "$SOURCE_COMMIT" --artifact "$ARTIFACT" --out candidate --source-out source.json
      - name: Upload and compare against the reviewed fixed run
        env:
          PIXEL_EAGLE_TOKEN: ${{ secrets.PIXEL_EAGLE_TOKEN }}
          PROJECT: ${{ vars.PIXEL_EAGLE_PROJECT }}
          BASELINE: ${{ steps.source.outputs.baseline }}
          UPLOAD_ONLY: ${{ inputs.upload_only || false }}
        run: |
          args=(--baseline-run "$BASELINE")
          if [[ "$UPLOAD_ONLY" == true ]]; then args=(--upload-only); fi
          mise exec -- python3 scripts/visual-pixeleagle.py --captures candidate --source source.json --project "$PROJECT" --out publication "${args[@]}"
      - name: Save service verdict and review links
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pixeleagle-${{ matrix.artifact }}
          path: publication/
          retention-days: 7
