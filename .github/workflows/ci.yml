name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "docs-dev/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "docs-dev/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  MBX_CACHE_LINKS: "0"

jobs:
  quality:
    name: Formatting and build scripts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.8
          install_args: rust mr-boxington just python node bun github:rhysd/actionlint zizmor shellcheck
          cache: false
      - run: mise exec -- npm ci --ignore-scripts
      - run: mise exec -- just ci-format ci-scripts ci-workflows

  headless:
    name: Headless libraries and networking
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          lane: headless-debug0
      - name: Lint headless libraries and examples
        run: mise exec -- just ci-headless-lint
      - name: Test headless libraries and networking
        run: mise exec -- just ci-headless-test
      - name: Verify isolated source export
        run: mise exec -- just ci-export
      - name: Compiler cache statistics
        if: always()
        run: mise exec -- mbx stats

  # Lint, tests and collaboration builds each have their own runner and
  # compiler-cache lane so they run in parallel without sharing a disk. RoboSim
  # stays with the tests: it reuses most of their graph, and every extra lane
  # adds about a gigabyte per main commit to the 10 GB repository cache quota.
  native-lint:
    name: Native viewer lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native platform headers
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libasound2-dev libudev-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxkbcommon-dev libwayland-dev
      - uses: ./.github/actions/setup-rust
        with:
          lane: native-lint-ci
      - name: Lint native viewers and examples
        run: mise exec -- just ci-native-lint
      - name: Compiler cache statistics
        if: always()
        run: mise exec -- mbx stats

  native-test:
    name: Native viewer tests and RoboSim validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native platform headers
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libasound2-dev libudev-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxkbcommon-dev libwayland-dev
      - uses: ./.github/actions/setup-rust
        with:
          lane: native-test-ci
      - name: Test native viewers and streaming
        run: mise exec -- just ci-native-test
      - name: Validate RoboSim without a window
        run: mise exec -- just ci-robosim
      - name: Compiler cache statistics
        if: always()
        run: mise exec -- mbx stats

  native-examples:
    name: Native collaboration example builds
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native platform headers
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libasound2-dev libudev-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxkbcommon-dev libwayland-dev
      - uses: ./.github/actions/setup-rust
        with:
          lane: native-examples-ci
      - name: Lint and build native collaboration examples
        run: mise exec -- just ci-native-examples
      - name: Compiler cache statistics and remaining disk
        if: always()
        run: |
          mise exec -- mbx stats
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"

  native:
    # Preserve the existing check name and fail if any native lane fails or is skipped.
    name: Native viewers and RoboSim
    needs: [native-lint, native-test, native-examples]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every native validation lane
        env:
          LINT: ${{ needs.native-lint.result }}
          TEST: ${{ needs.native-test.result }}
          EXAMPLES: ${{ needs.native-examples.result }}
        run: test "$LINT" = success && test "$TEST" = success && test "$EXAMPLES" = success

  wasm-lint:
    name: WASM lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          lane: wasm-lint-ci
      - name: Lint WASM examples
        run: mise exec -- just ci-wasm
      - name: Compiler cache statistics
        if: always()
        run: mise exec -- mbx stats

  # Build jobs save their compiler cache on main even when a browser suite
  # fails later, so the next run starts warm instead of from scratch.
  gallery-build:
    name: Gallery build (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: [splat, robot, pointcloud, examples]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          lane: gallery-${{ matrix.group }}
          tools: cargo:wasm-bindgen-cli
      - name: Build this browser group
        env:
          SHOWCASE_GROUP: ${{ matrix.group }}
        run: mise exec -- just showcase-build --profile release --group "$SHOWCASE_GROUP"
      - name: Save browser build outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gallery-build-${{ matrix.group }}
          path: splat-web/
          if-no-files-found: error
          retention-days: 1
      - name: Compiler cache statistics
        if: always()
        run: mise exec -- mbx stats

  gallery-package:
    name: Assemble complete gallery
    needs: gallery-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.8
          install_args: rust just python
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gallery-build-*
          merge-multiple: true
          path: splat-web/
      - name: Validate and package every browser target without rebuilding
        run: mise exec -- just showcase-build --package-only --output dist/showcase
      - name: Save the complete site for browser checks
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gallery-site
          path: dist/showcase/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  gallery-browser:
    name: Gallery browser (${{ matrix.suite }})
    needs: gallery-package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [gallery, splat, robot]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.8
          install_args: just python node
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gallery-site
          path: dist/showcase/
      - name: Install browser test dependencies
        run: |
          mise exec -- npm ci --ignore-scripts
          mise exec -- npx playwright install --with-deps chromium
      - name: Install software Vulkan for viewer checks
        if: matrix.suite != 'gallery'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y mesa-vulkan-drivers libvulkan1 xvfb xauth
      - name: Check gallery builder and project-subpath packaging
        if: matrix.suite == 'gallery'
        run: |
          mise exec -- just ci-gallery-builder
          mise exec -- node scripts/check-gallery.cjs dist/showcase
      - name: Check scene links and cross-origin viewer embedding
        if: matrix.suite == 'splat'
        env:
          SPLAT_LAUNCH_HEADED: "1"
        run: |
          mise exec -- python3 -m http.server 8765 --bind 127.0.0.1 --directory dist/showcase > /tmp/splat-launch-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          ready=false
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/ > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then cat /tmp/splat-launch-http.log; exit 1; fi
          xvfb-run -a -s "-screen 0 1280x720x24" mise exec -- just splat-web-check http://127.0.0.1:8765/
      - name: Check the browser robot viewer with an offline URDF package
        if: matrix.suite == 'robot'
        env:
          ROBOT_BROWSER_HEADED: "1"
        run: xvfb-run -a -s "-screen 0 1280x720x24" mise exec -- just robot-web-check dist/showcase
      - name: Save viewer evidence
        if: always() && matrix.suite != 'gallery'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gallery-check-${{ matrix.suite }}
          path: |
            dist/splat-launch-check/
            dist/robot-browser-check/
          retention-days: 7

  gallery:
    # Preserve the existing check name and publish exactly the site every suite tested.
    name: WebGPU examples and gallery
    needs: [wasm-lint, gallery-package, gallery-browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require lint, complete packaging and all browser suites
        env:
          LINT: ${{ needs.wasm-lint.result }}
          PACKAGE: ${{ needs.gallery-package.result }}
          BROWSERS: ${{ needs.gallery-browser.result }}
        run: test "$LINT" = success && test "$PACKAGE" = success && test "$BROWSERS" = success
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gallery-site
          path: dist/showcase/
      - name: Upload complete tested Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/showcase

  deploy:
    name: Publish example website
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [quality, headless, native, gallery]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy the verified gallery artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
