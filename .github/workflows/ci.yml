name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "docs-dev/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "docs-dev/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  MBX_CACHE_LINKS: "0"

jobs:
  quality:
    name: Formatting and build scripts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.8
          install_args: rust mr-boxington just python node bun github:rhysd/actionlint zizmor shellcheck
          cache: false
      - run: mise exec -- npm ci --ignore-scripts
      - run: mise exec -- just ci-format ci-scripts ci-workflows

  headless:
    name: Headless libraries and networking
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          lane: headless-debug0
      - name: Lint headless libraries and examples
        run: mise exec -- just ci-headless-lint
      - name: Test headless libraries and networking
        run: mise exec -- just ci-headless-test
      - name: Verify isolated source export
        run: mise exec -- just ci-export
      - name: Compiler cache statistics
        if: always()
        run: mise exec -- mbx stats

  native-viewers:
    name: Native viewer tests and RoboSim validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native platform headers
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libasound2-dev libudev-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxkbcommon-dev libwayland-dev
      - uses: ./.github/actions/setup-rust
        with:
          lane: native-viewers-ci
      - name: Lint native viewers and examples
        run: mise exec -- just ci-native-lint
      - name: Test native viewers and streaming
        run: mise exec -- just ci-native-test
      - name: Validate RoboSim without a window
        run: mise exec -- just ci-robosim
      - name: Compiler cache statistics
        if: always()
        run: mise exec -- mbx stats

  native-examples:
    name: Native collaboration example builds
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native platform headers
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libasound2-dev libudev-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxkbcommon-dev libwayland-dev
      - uses: ./.github/actions/setup-rust
        with:
          lane: native-examples-ci
      - name: Lint and build native collaboration examples
        run: mise exec -- just ci-native-examples
      - name: Compiler cache statistics and remaining disk
        if: always()
        run: |
          mise exec -- mbx stats
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"

  native:
    # Preserve the existing required check name and fail if either lane fails
    # or is skipped. Keeping their feature graphs on separate disks avoids ENOSPC.
    name: Native viewers and RoboSim
    needs: [native-viewers, native-examples]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require both native validation lanes
        env:
          VIEWERS: ${{ needs.native-viewers.result }}
          EXAMPLES: ${{ needs.native-examples.result }}
        run: test "$VIEWERS" = success && test "$EXAMPLES" = success

  gallery:
    name: WebGPU examples and gallery
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          lane: wasm-release
          tools: cargo:wasm-bindgen-cli node
      - name: Lint WASM examples
        run: mise exec -- just ci-wasm
      - name: Build and package all browser examples
        run: mise exec -- just showcase-release
      - name: Install browser test dependencies
        run: |
          mise exec -- npm ci --ignore-scripts
          mise exec -- npx playwright install --with-deps chromium
      - name: Check restored gallery builder selections
        run: mise exec -- just ci-gallery-builder
      - name: Check the packaged gallery under a project subpath
        run: mise exec -- node scripts/check-gallery.cjs dist/showcase
      - name: Install software Vulkan for viewer startup checks
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y mesa-vulkan-drivers libvulkan1 xvfb xauth
      - name: Check scene links and cross-origin viewer embedding
        env:
          SPLAT_LAUNCH_HEADED: "1"
        run: |
          mise exec -- python3 -m http.server 8765 --bind 127.0.0.1 --directory dist/showcase > /tmp/splat-launch-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          ready=false
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/ > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then cat /tmp/splat-launch-http.log; exit 1; fi
          xvfb-run -a -s "-screen 0 1280x720x24" mise exec -- just splat-web-check http://127.0.0.1:8765/
      - name: Save viewer startup evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: splat-viewer-launch
          path: dist/splat-launch-check/
          retention-days: 7
      - name: Upload complete Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/showcase
      - name: Compiler cache statistics
        if: always()
        run: mise exec -- mbx stats

  deploy:
    name: Publish example website
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [quality, headless, native, gallery]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy the verified gallery artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
