name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "docs-dev/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "docs-dev/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  MBX_CACHE_LINKS: "0"

jobs:
  quality:
    name: Formatting and build scripts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.8
          install_args: rust mr-boxington just python node bun github:rhysd/actionlint zizmor shellcheck
          cache: false
      - run: mise exec -- npm ci --ignore-scripts
      - run: mise exec -- just ci-format ci-scripts ci-workflows

  headless:
    name: Headless libraries and networking
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          lane: headless-debug0
      - name: Lint headless libraries and examples
        run: mise exec -- just ci-headless-lint
      - name: Test headless libraries and networking
        run: mise exec -- just ci-headless-test
      - name: Verify isolated source export
        run: mise exec -- just ci-export
      - name: Compiler cache statistics
        if: always()
        run: mise exec -- mbx stats

  # Lint, tests and collaboration builds each have their own runner and
  # compiler-cache lane so they run in parallel without sharing a disk. RoboSim
  # stays with the tests: it reuses most of their graph, and every extra lane
  # adds about a gigabyte per main commit to the 10 GB repository cache quota.
  native-lint:
    name: Native viewer lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native platform headers
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libasound2-dev libudev-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxkbcommon-dev libwayland-dev
      - uses: ./.github/actions/setup-rust
        with:
          lane: native-lint-ci
      - name: Lint native viewers and examples
        run: mise exec -- just ci-native-lint
      - name: Compiler cache statistics
        if: always()
        run: mise exec -- mbx stats

  native-test:
    name: Native viewer tests and RoboSim validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native platform headers
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libasound2-dev libudev-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxkbcommon-dev libwayland-dev
      - uses: ./.github/actions/setup-rust
        with:
          lane: native-test-ci
      - name: Test native viewers and streaming
        run: mise exec -- just ci-native-test
      - name: Validate RoboSim without a window
        run: mise exec -- just ci-robosim
      - name: Compiler cache statistics
        if: always()
        run: mise exec -- mbx stats

  native-examples:
    name: Native collaboration example builds
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native platform headers
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libasound2-dev libudev-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxkbcommon-dev libwayland-dev
      - uses: ./.github/actions/setup-rust
        with:
          lane: native-examples-ci
      - name: Lint and build native collaboration examples
        run: mise exec -- just ci-native-examples
      - name: Compiler cache statistics and remaining disk
        if: always()
        run: |
          mise exec -- mbx stats
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"

  native:
    # Preserve the existing check name and fail if any native lane fails or is skipped.
    name: Native viewers and RoboSim
    needs: [native-lint, native-test, native-examples]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every native validation lane
        env:
          LINT: ${{ needs.native-lint.result }}
          TEST: ${{ needs.native-test.result }}
          EXAMPLES: ${{ needs.native-examples.result }}
        run: test "$LINT" = success && test "$TEST" = success && test "$EXAMPLES" = success

  wasm-lint:
    name: WASM lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          lane: wasm-lint-ci
      - name: Lint WASM examples
        run: mise exec -- just ci-wasm
      - name: Compiler cache statistics
        if: always()
        run: mise exec -- mbx stats

  # Each group first fingerprints everything its build reads
  # (scripts/showcase.py --fingerprints). When main already built those exact
  # inputs, the job reuses that output and skips Rust setup and compilation.
  # Outputs are saved from main only; any fingerprint error builds instead.
  # Build jobs save their compiler cache on main even when a browser suite
  # fails later, so the next run starts warm instead of from scratch.
  gallery-build:
    name: Gallery build (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: [splat, robot, pointcloud, examples]
    env:
      SHOWCASE_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fingerprint this group's inputs
        id: inputs
        env:
          # Metadata only; the pinned toolchain is installed only for a build.
          RUSTUP_TOOLCHAIN: stable
        run: echo "key=$(python3 scripts/showcase.py --fingerprint "build:$SHOWCASE_GROUP" || true)" >> "$GITHUB_OUTPUT"
      - name: Reuse main's output for unchanged inputs
        id: reuse
        if: steps.inputs.outputs.key != '' && github.event_name != 'workflow_dispatch'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: gallery-out/${{ matrix.group }}
          key: gallery-build-${{ matrix.group }}-${{ steps.inputs.outputs.key }}
      - uses: ./.github/actions/setup-rust
        if: steps.reuse.outputs.cache-hit != 'true'
        with:
          lane: gallery-${{ matrix.group }}
          tools: cargo:wasm-bindgen-cli
      - name: Build this browser group
        if: steps.reuse.outputs.cache-hit != 'true'
        run: |
          mise exec -- just showcase-build --profile release --group "$SHOWCASE_GROUP"
          # Keep only build products: reused output must never carry tracked
          # gallery files from the commit that built it.
          mkdir -p "gallery-out/$SHOWCASE_GROUP"
          git ls-files -z --others -- splat-web | tar --null -T - -cf - | tar -xf - -C "gallery-out/$SHOWCASE_GROUP"
      - name: Remember this output for later runs
        if: steps.reuse.outputs.cache-hit != 'true' && steps.inputs.outputs.key != '' && (github.ref == 'refs/heads/main' && github.event_name == 'push' || github.head_ref == 'ci/gallery-skip-unchanged')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: gallery-out/${{ matrix.group }}
          key: gallery-build-${{ matrix.group }}-${{ steps.inputs.outputs.key }}
      - name: Save browser build outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gallery-build-${{ matrix.group }}
          path: gallery-out/${{ matrix.group }}/
          if-no-files-found: error
          retention-days: 1
      - name: Compiler cache statistics
        if: always() && steps.reuse.outputs.cache-hit != 'true'
        run: mise exec -- mbx stats

  gallery-package:
    name: Assemble complete gallery
    needs: gallery-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.8
          install_args: rust just python
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gallery-build-*
          merge-multiple: true
          path: .
      - name: Require build outputs to leave tracked gallery files untouched
        run: git diff --exit-code --stat -- splat-web
      - name: Validate and package every browser target without rebuilding
        run: mise exec -- just showcase-build --package-only --output dist/showcase
      - name: Save the complete site for browser checks
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gallery-site
          path: dist/showcase/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  gallery-browser:
    name: Gallery browser (${{ matrix.suite }})
    needs: gallery-package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [gallery, splat, robot, pointcloud]
    env:
      SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A suite's fingerprint covers the builds it tests, its check script,
      # fixtures and browser tooling. Main records each pass, so a suite whose
      # inputs main already passed is skipped; anything else runs it.
      - name: Fingerprint this suite's inputs
        id: inputs
        env:
          RUSTUP_TOOLCHAIN: stable
        run: echo "key=$(python3 scripts/showcase.py --fingerprint "suite:$SUITE" || true)" >> "$GITHUB_OUTPUT"
      - name: Look for main's pass on the same inputs
        id: passed
        if: steps.inputs.outputs.key != '' && github.event_name != 'workflow_dispatch'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: gallery-out/suite-${{ matrix.suite }}
          key: gallery-suite-${{ matrix.suite }}-${{ steps.inputs.outputs.key }}
          lookup-only: true
      - name: Skip a suite main already passed
        if: steps.passed.outputs.cache-hit == 'true'
        run: |
          echo "::notice::$SUITE suite skipped: main passed these inputs"
          echo "SKIP_SUITE=true" >> "$GITHUB_ENV"
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        if: env.SKIP_SUITE != 'true'
        with:
          version: 2026.10.8
          install_args: just python node
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.SKIP_SUITE != 'true'
        with:
          name: gallery-site
          path: dist/showcase/
      - name: Install browser test dependencies
        if: env.SKIP_SUITE != 'true'
        run: |
          mise exec -- npm ci --ignore-scripts
          mise exec -- npx playwright install --with-deps chromium
      - name: Install software Vulkan for viewer checks
        if: env.SKIP_SUITE != 'true' && (matrix.suite != 'gallery')
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y mesa-vulkan-drivers libvulkan1 xvfb xauth
      - name: Check gallery builder and project-subpath packaging
        if: env.SKIP_SUITE != 'true' && (matrix.suite == 'gallery')
        run: |
          mise exec -- just ci-gallery-builder
          mise exec -- node scripts/check-gallery.cjs dist/showcase
      - name: Check scene links and cross-origin viewer embedding
        if: env.SKIP_SUITE != 'true' && (matrix.suite == 'splat')
        env:
          SPLAT_LAUNCH_HEADED: "1"
        run: |
          mise exec -- python3 -m http.server 8765 --bind 127.0.0.1 --directory dist/showcase > /tmp/splat-launch-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          ready=false
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/ > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then cat /tmp/splat-launch-http.log; exit 1; fi
          xvfb-run -a -s "-screen 0 1280x720x24" mise exec -- just splat-web-check http://127.0.0.1:8765/
      - name: Check the browser robot viewer with an offline URDF package
        if: env.SKIP_SUITE != 'true' && (matrix.suite == 'robot')
        env:
          ROBOT_BROWSER_HEADED: "1"
        run: xvfb-run -a -s "-screen 0 1280x720x24" mise exec -- just robot-web-check dist/showcase
      - name: Check point-cloud file, URL, drop and settings controls
        if: env.SKIP_SUITE != 'true' && (matrix.suite == 'pointcloud')
        env:
          POINTCLOUD_BROWSER_HEADED: "1"
        run: |
          mise exec -- python3 -m http.server 8765 --bind 127.0.0.1 --directory dist/showcase > /tmp/pointcloud-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          ready=false
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/ > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then cat /tmp/pointcloud-http.log; exit 1; fi
          xvfb-run -a -s "-screen 0 1280x720x24" mise exec -- just pointcloud-web-check http://127.0.0.1:8765/
      - name: Save viewer evidence
        if: env.SKIP_SUITE != 'true' && (always() && matrix.suite != 'gallery')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gallery-check-${{ matrix.suite }}
          path: |
            dist/splat-launch-check/
            dist/robot-browser-check/
            dist/pointcloud-browser-check/
          retention-days: 7
      - name: Record this pass for later runs
        if: env.SKIP_SUITE != 'true' && steps.inputs.outputs.key != '' && (github.ref == 'refs/heads/main' && github.event_name == 'push' || github.head_ref == 'ci/gallery-skip-unchanged')
        run: mkdir -p "gallery-out/suite-$SUITE" && echo passed > "gallery-out/suite-$SUITE/passed"
      - name: Remember this pass
        if: env.SKIP_SUITE != 'true' && steps.inputs.outputs.key != '' && (github.ref == 'refs/heads/main' && github.event_name == 'push' || github.head_ref == 'ci/gallery-skip-unchanged')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: gallery-out/suite-${{ matrix.suite }}
          key: gallery-suite-${{ matrix.suite }}-${{ steps.inputs.outputs.key }}

  gallery:
    # Preserve the existing check name and publish exactly the site every suite tested.
    name: WebGPU examples and gallery
    needs: [wasm-lint, gallery-package, gallery-browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require lint, complete packaging and all browser suites
        env:
          LINT: ${{ needs.wasm-lint.result }}
          PACKAGE: ${{ needs.gallery-package.result }}
          BROWSERS: ${{ needs.gallery-browser.result }}
        run: test "$LINT" = success && test "$PACKAGE" = success && test "$BROWSERS" = success
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gallery-site
          path: dist/showcase/
      - name: Upload complete tested Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/showcase

  deploy:
    name: Publish example website
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [quality, headless, native, gallery]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy the verified gallery artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
