name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "docs-dev/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "docs-dev/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  MBX_CACHE_LINKS: "0"

jobs:
  quality:
    name: Formatting and build scripts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.10.8
          install_args: rust mr-boxington just python node github:rhysd/actionlint zizmor shellcheck
          cache: false
      - run: mise exec -- just ci-format ci-scripts ci-workflows

  headless:
    name: Headless libraries and networking
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          lane: headless-debug0
      - run: mise exec -- just ci-headless
      - name: Compiler cache statistics
        if: always()
        run: mise exec -- mbx stats

  native:
    name: Native viewers and RoboSim
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install native platform headers
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libasound2-dev libudev-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxkbcommon-dev libwayland-dev
      - uses: ./.github/actions/setup-rust
        with:
          lane: native-debug0
      - run: mise exec -- just ci-native
      - name: Compiler cache statistics
        if: always()
        run: mise exec -- mbx stats

  gallery:
    name: WebGPU examples and gallery
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          lane: wasm-release
          tools: cargo:wasm-bindgen-cli node
      - name: Lint WASM examples
        run: mise exec -- just ci-wasm
      - name: Build and package all browser examples
        run: mise exec -- just showcase-release
      - name: Install browser test dependencies
        run: |
          mise exec -- npm ci --ignore-scripts
          mise exec -- npx playwright install --with-deps chromium
      - name: Check the packaged gallery under a project subpath
        run: mise exec -- node scripts/check-gallery.cjs dist/showcase
      - name: Upload complete Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/showcase
      - name: Compiler cache statistics
        if: always()
        run: mise exec -- mbx stats

  deploy:
    name: Publish example website
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [quality, headless, native, gallery]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy the verified gallery artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
