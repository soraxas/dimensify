[package]
name = "sog_codec"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
worker = ["dep:wasm-bindgen"]

[lints]
workspace = true

[dependencies]
image = { version = "=0.25.9", default-features = false, features = ["webp"] }
wasm-bindgen = { version = "=0.2.117", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
zip = { version = "2", default-features = false }
