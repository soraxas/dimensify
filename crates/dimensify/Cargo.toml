[package]
name = "dimensify"
autobins = false
authors.workspace = true
description = "Core Dimensify viewer plugins and an optional standalone robot viewer."
edition.workspace = true
homepage.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
default = []
# Standalone native kinematic viewer; disabled by default.
robot = ["dep:urdf-rs", "dep:mesh-loader", "bevy/3d", "bevy/ui", "bevy/default_platform", "bevy/png"]

[dependencies]
bevy = { workspace = true }
color-eyre = { workspace = true }
eyre = { workspace = true }
dimensify_ui = { workspace = true }
urdf-rs = { workspace = true, optional = true }
mesh-loader = { workspace = true, optional = true }

[[bin]]
name = "robosim"
path = "src/bin/robosim.rs"
required-features = ["robot"]

[lib]
name = "dimensify"
path = "src/lib.rs"
