[package]
name = "dimensify"
autobins = false
authors.workspace = true
description = "Core Dimensify viewer plugins and an optional standalone robot viewer."
edition.workspace = true
homepage.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
default = []
playground = ["dep:dimensify_camera", "dimensify_camera/viewer", "bevy/bevy_pbr", "bevy/bevy_render", "bevy/bevy_winit", "bevy/bevy_window", "bevy/bevy_log", "bevy/bevy_feathers", "bevy/bevy_ui_render", "bevy/default_font", "bevy/bevy_scene", "bevy/ui_picking", "bevy/x11", "bevy/webgpu", "bevy/tonemapping_luts", "bevy/zstd_rust"]
# Optional standalone PLY/SOG viewer and reusable splat plugin.
splat = ["dep:dimensify_splat", "dimensify_splat/viewer"]
pointcloud = ["dep:dimensify_pointcloud", "dimensify_pointcloud/viewer"]
splat-viewer-perf = ["splat", "dimensify_splat/viewer-perf"]
# Standalone kinematic viewer for local or HTTP(S) URDFs; native and WebGPU browser.
robot = ["dep:dimensify_camera", "dimensify_camera/inspect", "dep:urdf-rs", "dep:mesh-loader", "dep:ehttp", "dep:url", "dep:web-sys", "bevy/3d", "bevy/ui", "bevy/default_platform", "bevy/png", "bevy/webgpu"]

[dependencies]
dimensify_camera = { path = "../camera", optional = true }
dimensify_splat = { path = "../splat", optional = true }
dimensify_pointcloud = { path = "../pointcloud", optional = true }
bevy = { workspace = true, features = ["bevy_camera", "bevy_core_pipeline", "bevy_anti_alias"] }
color-eyre = { workspace = true }
eyre = { workspace = true }
dimensify_ui = { workspace = true }
urdf-rs = { workspace = true, optional = true }
mesh-loader = { workspace = true, optional = true }
ehttp = { version = "0.5", features = ["streaming"], optional = true }
url = { version = "2", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Browser robot viewer reads its URDF source from the page query.
web-sys = { version = "0.3", features = ["Window", "Location"], optional = true }

[[bin]]
name = "robosim"
path = "src/bin/robosim.rs"
required-features = ["robot"]

[lib]
name = "dimensify"
path = "src/lib.rs"

[[example]]
name = "splat_viewer"
required-features = ["splat"]

[[example]]
name = "pointcloud_viewer"
required-features = ["pointcloud"]

[[example]]
name = "pointcloud_fixture"
required-features = ["pointcloud"]

[[package.metadata.showcase]]
target = "pointcloud_viewer"
kind = "example"
id = "pointcloud"
title = "Point-cloud viewer"
targets = ["browser", "native"]
description = "Open or drop PLY files and Potree folders, load hosted datasets, or explore a built-in cloud. Adjust point size, shape, orientation and LOD live."
note = "WebGPU. Local files stay on your device. Remote hosts need CORS; shared Potree files use byte ranges."
features = ["pointcloud", "dimensify_pointcloud/webgpu"]
browser = true

[[package.metadata.showcase]]
target = "pointcloud_fixture"
kind = "example"
id = "pointcloud-fixture"
title = "Point-cloud fixture"
targets = ["browser", "native"]
description = "A deterministic colored cloud rendered without external assets through the shared loader."
note = "WebGPU. Also supports a separate WebGL2 build."
features = ["pointcloud", "dimensify_pointcloud/webgpu"]
browser = true

[[package.metadata.showcase]]
target = "splat_viewer"
kind = "example"
id = "splat"
title = "Gaussian splat viewer"
targets = ["browser", "native"]
description = "Open PLY, bundled SOG or a hosted hierarchy. Try Fly/Orbit, live up-axis changes, drag/drop and touch pan/pinch."
note = "WebGPU browser build required for the live example."
features = ["splat"]
browser = true
href = "../index.html"
sog_worker = true
release_profile = "wasm-release"

[[package.metadata.showcase]]
target = "robosim"
kind = "bin"
id = "robot"
title = "URDF kinematic viewer"
targets = ["browser", "native"]
description = "Load the demo arm or any URDF by URL, including package:// meshes and GitHub file links. Move joints, orbit, pan and frame."
note = "WebGPU; keyboard joint control. Mesh hosts must allow CORS. Dynamics remain planned."
features = ["robot"]
browser = true
release_profile = "wasm-release"

[[package.metadata.showcase]]
target = "camera_setup"
kind = "example"
id = "camera"
title = "Camera setup"
targets = ["headless"]
description = "Create and query the primary viewer camera without starting a window or GPU."
note = "Console example."

[[example]]
name = "camera_playground"
required-features = ["playground"]

[[package.metadata.showcase]]
target = "camera_playground"
id = "camera-playground"
title = "Camera playground"
browser = true
features = ["playground"]
description = "Orbit, fly, pan, zoom and frame a built-in scene with shared desktop and touch controls."
note = "WebGPU. Runs locally; no files or server required."
