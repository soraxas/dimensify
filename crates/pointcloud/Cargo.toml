[package]
name = "dimensify_pointcloud"
version.workspace = true
edition.workspace = true
publish = false

[lib]
path = "src/mod.rs"

[features]
default = ["render"]
render = ["dep:bevy_pointcloud", "dep:ply-rs", "dep:send_wrapper", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:web-sys"]
webgpu = ["render", "bevy_pointcloud/webgpu", "bevy/webgpu"]
webgl = ["render", "bevy_pointcloud/webgl2", "bevy/webgl2"]
viewer = ["render", "dep:dimensify_camera", "dimensify_camera/viewer", "dimensify_camera/depth_pick", "dep:web-sys", "dep:url", "dep:rfd", "dep:wasm-bindgen", "bevy/bevy_feathers", "bevy/bevy_scene", "bevy/bevy_winit", "bevy/bevy_window", "bevy/bevy_log", "bevy/bevy_ui_render", "bevy/default_font", "bevy/ui_picking", "bevy/x11", "bevy/tonemapping_luts", "bevy/zstd_rust"]

[dependencies]
bevy = { workspace = true, features = ["bevy_asset", "bevy_camera"] }
bevy_pointcloud = { path = "../../vendor/bevy_pointcloud", optional = true, default-features = false, features = ["server", "http_source", "potree"] }
dimensify_camera = { path = "../camera", optional = true }
ply-rs = { version = "0.1", optional = true }
url = { version = "2", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { version = "0.15.4", optional = true }
bevy = { workspace = true, features = ["multi_threaded"] }
bevy_pointcloud = { path = "../../vendor/bevy_pointcloud", optional = true, default-features = false, features = ["multi_threaded"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
send_wrapper = { version = "0.6", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = ["Window", "Location", "File", "Blob"] }

[lints]
workspace = true

[dev-dependencies]
potree = { path = "../../vendor/potree-rs", features = ["async"] }
futures = "0.3"
tempfile = "3"
serde_json.workspace = true
